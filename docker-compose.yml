services:
  app:
    build: .
    container_name: oj
    ports:
      - "127.0.0.1:8018:8018"
    volumes:
      - ./data:/app/data
  
  
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: oj-frontend
    ports:
      - "127.0.0.1:8550:8550"
    environment:
      API_URL: http://app:8018
    depends_on:
      - app
